[project]
name = "eventyay-hubspot"
dynamic = ["version"]
description = "This plugin allows you to integrate Eventyay with Hubspot"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["Eventyay"]
authors = [
    {name = "Om Vanwari", email = "mrvanwariomg@gmail.com"},
]
maintainers = [
    {name = "Om Vanwari", email = "mrvanwariomg@gmail.com"},
]

dependencies = [
    "cryptography>=50.0.0",
    "requests",
    "python-dotenv"
]

[project.entry-points."pretix.plugin"]
hubspot = "hubspot:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/fossasia/eventyay-hubspot"
repository = "https://github.com/fossasia/eventyay-hubspot"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hubspot = [
    "static/**/*",
    "templates/**/*",
    "locale/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "hubspot.__version__"}

[tool.setuptools.packages.find]
include = ["hubspot*"]
namespaces = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "eventyay.config.settings"

[tool.coverage.run]
source = ["hubspot"]
omit = [
    "*/migrations/*",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE", "PLW", "UP"]
ignore = ["E722", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2